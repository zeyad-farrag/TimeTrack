services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - team_app_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:?DEFAULT_ORG_SLUG is required}
      DEFAULT_ORG_NAME: ${DEFAULT_ORG_NAME:?DEFAULT_ORG_NAME is required}
      ORG_CREATION_ENABLED: ${ORG_CREATION_ENABLED:?ORG_CREATION_ENABLED is required}
      TEAM_APP_SHARED_SECRET: ${TEAM_APP_SHARED_SECRET:?TEAM_APP_SHARED_SECRET is required}
      TEAM_APP_URL: ${TEAM_APP_URL:?TEAM_APP_URL is required}
      MULTICA_BASE_URL: ${MULTICA_BASE_URL:?MULTICA_BASE_URL is required}
      MULTICA_WS_URL: ${MULTICA_WS_URL:?MULTICA_WS_URL is required}
      TEAM_APP_SYSTEM_USER_PAT: ${TEAM_APP_SYSTEM_USER_PAT:?TEAM_APP_SYSTEM_USER_PAT is required}
      TEAM_APP_SYSTEM_USER_ID: ${TEAM_APP_SYSTEM_USER_ID:?TEAM_APP_SYSTEM_USER_ID is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_TEAM_APP_URL: ${NEXT_PUBLIC_TEAM_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_TEAM_API_URL: ${NEXT_PUBLIC_TEAM_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

volumes:
  team_app_db:
